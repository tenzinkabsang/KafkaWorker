title: KafkaWorker
description: >-
  A .NET library that abstracts Kafka consumer infrastructure — retry, DLQ,
  offset management, and DLQ reprocessing — so you can focus on business logic.

logo: "/icons/kafkaworker-logo-horizontal.svg"

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

baseurl: "/KafkaWorker"
url: "https://tenzinkabsang.github.io"

author: Tenzin Kabsang
repository: tenzinkabsang/KafkaWorker

kramdown:
  input: GFM
  syntax_highlighter: rouge

color_scheme: light

search_enabled: true
search:
  button: true

enable_copy_code_button: true

# Styles the {: .note } / {: .important } / {: .warning } callouts used across the docs.
# Without this map, just-the-docs renders them as plain paragraphs.
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red

aux_links:
  "View on GitHub":
    - "https://github.com/tenzinkabsang/KafkaWorker"
aux_links_new_tab: true

nav_external_links:
  - title: KafkaWorker on NuGet
    url: https://www.nuget.org/packages/KafkaWorker/

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/tenzinkabsang/KafkaWorker"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

footer_content: >-
  KafkaWorker is distributed under the
  <a href="https://github.com/tenzinkabsang/KafkaWorker/blob/main/LICENSE">MIT License</a>.

back_to_top: true
back_to_top_text: "Back to top"

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
